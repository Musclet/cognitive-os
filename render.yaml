services:
  - type: web
    name: cognitive-os
    runtime: python
    repo: https://github.com/Musclet/cognitive-os
    branch: master
    buildCommand: pip install -e . && python -m playwright install chromium && cd web && npm install && npm run build && cd ..
    startCommand: python scripts/render_run.py
    plan: free
    envVars:
      - key: DATA_DIR
        value: /tmp/cognitive-os
      - key: DATABASE_URL
        sync: false
      - key: SNAPSHOT_PATH
        value: data/state_snapshot.json
      - key: WEB_UI_PIN
        sync: false
      - key: WEB_UI_SESSION_SECRET
        generateValue: true
      - key: WEB_UI_COOKIE_SECURE
        value: "true"
      - key: INSPECTOR_ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://cognitive-os.onrender.com"
      - key: GOOGLE_CALENDAR_MOCK
        value: "false"
      - key: GOOGLE_CALENDAR_WRITE_ENABLED
        value: "true"
      - key: GOOGLE_CALENDAR_WRITE_REQUIRES_ACCEPTANCE
        value: "true"
      - key: GOOGLE_CALENDAR_SCHEDULE_WRITE_ENABLED
        value: "false"
      - key: GOOGLE_CALENDAR_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_JSON
        sync: false
      - key: GOOGLE_CALENDAR_CALENDAR_ID
        value: "primary"
      - key: GOOGLE_CALENDAR_TIMEZONE
        value: "Asia/Shanghai"
      - key: RENDER_ADMIN_IMPORT_ENABLED
        value: "false"
      - key: CLOUD_SYNC_TOKEN
        sync: false
      - key: CLOUD_SYNC_SOURCE_TIMEOUT_SECONDS
        value: "180"
      - key: CHAOXING_MOCK
        value: "false"
      - key: CHAOXING_STATE_JSON
        sync: false
      - key: JWXT_MOCK
        value: "false"
      - key: JWXT_COOKIES_JSON
        sync: false
      - key: MOMO_SYNC_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SCHEDULE_DAILY_SYNC_TIMES
        value: "07:00"
      - key: SCHEDULE_SYNC_INTERVAL_HOURS
        value: "0"
