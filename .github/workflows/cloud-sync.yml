name: Daily cloud sync

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-os-cloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wake Render and synchronize sources
        env:
          CLOUD_SYNC_URL: https://cognitive-os.onrender.com/api/internal/cloud-sync
          CLOUD_SYNC_TOKEN: ${{ secrets.CLOUD_SYNC_TOKEN }}
          CLOUD_SYNC_HTTP_TIMEOUT_SECONDS: "720"
        run: python scripts/render_cloud_sync.py
