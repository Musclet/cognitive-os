<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2438"/>
      <stop offset="100%" style="stop-color:#2d1b2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a0b4"/>
      <stop offset="100%" style="stop-color:#c4727c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="180" r="100" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.8"/>
  <!-- Inner ring (maskable safe zone) -->
  <circle cx="256" cy="180" r="90" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.3"/>
  <!-- Brain gyri (simplified) -->
  <path d="M190 150 Q210 110 256 110 Q302 110 322 150" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <path d="M185 180 Q180 210 195 230" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M327 180 Q332 210 317 230" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M205 170 Q220 195 240 210" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M307 170 Q292 195 272 210" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Neural network nodes -->
  <circle cx="256" cy="130" r="8" fill="#e8a0b4"/>
  <circle cx="220" cy="175" r="7" fill="#e8a0b4"/>
  <circle cx="292" cy="175" r="7" fill="#e8a0b4"/>
  <circle cx="236" cy="220" r="6" fill="#e8a0b4"/>
  <circle cx="276" cy="220" r="6" fill="#e8a0b4"/>
  <circle cx="210" cy="200" r="5" fill="#c4727c" opacity="0.7"/>
  <circle cx="302" cy="200" r="5" fill="#c4727c" opacity="0.7"/>
  <!-- Connections between nodes -->
  <line x1="256" y1="130" x2="220" y2="175" stroke="#c4727c" stroke-width="2.5" opacity="0.5"/>
  <line x1="256" y1="130" x2="292" y2="175" stroke="#c4727c" stroke-width="2.5" opacity="0.5"/>
  <line x1="220" y1="175" x2="236" y2="220" stroke="#c4727c" stroke-width="2" opacity="0.5"/>
  <line x1="292" y1="175" x2="276" y2="220" stroke="#c4727c" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="175" x2="210" y2="200" stroke="#c4727c" stroke-width="2" opacity="0.4"/>
  <line x1="292" y1="175" x2="302" y2="200" stroke="#c4727c" stroke-width="2" opacity="0.4"/>
  <line x1="236" y1="220" x2="210" y2="200" stroke="#c4727c" stroke-width="1.5" opacity="0.3"/>
  <line x1="276" y1="220" x2="302" y2="200" stroke="#c4727c" stroke-width="1.5" opacity="0.3"/>
  <!-- Central node (consciousness hub) -->
  <circle cx="256" cy="175" r="5" fill="#fff" opacity="0.3"/>
  <!-- Label -->
  <text x="256" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f5e6e8" letter-spacing="4">COG:OS</text>
  <text x="256" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a8878d" letter-spacing="6">认知操作系统</text>
  <text x="256" y="444" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#7a5c62" letter-spacing="2">PERSONAL CONSOLE</text>
</svg>
